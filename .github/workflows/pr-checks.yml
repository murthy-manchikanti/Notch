name: Notch CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notch-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: Regression tests
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun swift --version

      - name: Run regression tests
        run: |
          set -euo pipefail
          mkdir -p ci-logs
          zsh scripts/test.sh 2>&1 | tee ci-logs/tests.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: regression-test-logs
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Release build and packaging checks
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun swift --version

      - name: Build universal app
        run: |
          set -euo pipefail
          mkdir -p ci-logs

          xcodebuild \
            -project Notch.xcodeproj \
            -scheme Notch \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath .build/ci \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee ci-logs/build.log

      - name: Verify app contents and architectures
        run: |
          set -euo pipefail
          trap 'echo "::error::Verification failed at line $LINENO: $BASH_COMMAND"' ERR

          mkdir -p ci-logs
          exec > >(tee ci-logs/verification.log) 2>&1

          app_path=".build/ci/Build/Products/Release/Notch.app"
          executable="$app_path/Contents/MacOS/Notch"
          resources="$app_path/Contents/Resources"
          adapter="$app_path/Contents/Frameworks/MediaRemoteAdapter.framework/MediaRemoteAdapter"

          require_file() {
            if [[ ! -f "$1" ]]; then
              echo "::error::Required file is missing: $1"
              exit 1
            fi
            echo "Found: $1"
          }

          require_file "$executable"
          require_file "$adapter"
          require_file "$resources/mediaremote-adapter.pl"
          require_file "$resources/LICENSE"
          require_file "$resources/Assets.car"
          require_file "$resources/AppIcon.icns"
          require_file "$app_path/Contents/Info.plist"

          if [[ ! -x "$executable" ]]; then
            echo "::error::Notch binary is not executable."
            exit 1
          fi

          plutil -lint "$app_path/Contents/Info.plist"

          for binary in "$executable" "$adapter"; do
            echo "Architectures in $binary:"
            xcrun lipo "$binary" -archs

            for arch in arm64 x86_64; do
              if ! xcrun lipo "$binary" -verify_arch "$arch"; then
                echo "::error::Missing architecture $arch in $binary"
                exit 1
              fi
              echo "Verified: $arch"
            done
          done

          echo "All app contents and architecture checks passed."

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: release-build-logs
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 7

  verdict:
    name: PR verdict
    needs: [tests, build]
    if: always()
    runs-on: ubuntu-latest
    env:
      TEST_RESULT: ${{ needs.tests.result }}
      BUILD_RESULT: ${{ needs.build.result }}

    steps:
      - name: Report results
        run: |
          set -euo pipefail

          {
            echo "## Notch CI results"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Regression tests | $TEST_RESULT |"
            echo "| Release build and packaging | $BUILD_RESULT |"
            echo ""
            echo "Live playback, Bluetooth, Accessibility permissions,"
            echo "memory behavior, and visual placement require Mac testing."
            echo "Signing and notarization are not tested by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$TEST_RESULT" != "success" ||
                "$BUILD_RESULT" != "success" ]]; then
            echo "::error::Notch checks failed. Review the failed job and logs."
            exit 1
          fi

          echo "Build and automated checks passed."
